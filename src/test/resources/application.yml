# Configuracao exclusiva de TESTES.
# Aponta para um banco descartavel (estacionamento_kaneko_test), separado do
# banco de desenvolvimento, para nao interferir nos dados reais. O Flyway aplica
# as migrations e o Hibernate (ddl-auto=validate) confere o mapeamento das
# entidades contra o schema versionado.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_TEST_NAME:estacionamento_kaneko_test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

# Por padrao a seguranca fica desligada nos testes de cadastro/processo (os
# controllers sao exercitados diretamente). Os testes de autenticacao reativam
# com @SpringBootTest(properties = "app.security.enabled=true").
app:
  security:
    enabled: false
  jwt:
    secret: chave-de-teste-com-ao-menos-32-bytes-para-hmac-sha256
    expiration-minutes: 60
    issuer: estacionamento-kaneko
    audience: estacionamento-kaneko-api
  bootstrap-admin:
    enabled: false
  inventory:
    hold-duration-minutes: 15
    expiration-enabled: false
