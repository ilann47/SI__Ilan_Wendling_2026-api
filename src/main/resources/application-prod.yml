# Deliberately no production defaults for identity, database, public origin or TLS.
# Flyway cutovers remain test-only; production schema promotion is a separate gate.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: false
    clean-disabled: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  security:
    enabled: true
  jwt:
    secret: ${APP_JWT_SECRET:}
  bootstrap-admin:
    enabled: false
  demo-data:
    enabled: false
  production:
    public-url: ${APP_PUBLIC_URL:}
    tls-mode: ${APP_TLS_MODE:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
