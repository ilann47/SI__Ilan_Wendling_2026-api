spring:
  application:
    name: estacionamento

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:estacionamento_kaneko}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo

  jackson:
    time-zone: America/Sao_Paulo
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  security:
    # Quando habilitada, os endpoints /api/** (exceto /api/auth e o Swagger)
    # exigem um token JWT valido. Desligada apenas em testes de cadastro.
    enabled: ${APP_SECURITY_ENABLED:true}
  jwt:
    secret: ${APP_JWT_SECRET:kaneko-troque-esta-chave-secreta-em-producao-32+bytes}
    expiration-minutes: ${APP_JWT_EXP_MIN:480}
    issuer: ${APP_JWT_ISSUER:estacionamento-kaneko}
    audience: ${APP_JWT_AUDIENCE:estacionamento-kaneko-api}
  bootstrap-admin:
    # Cria um administrador inicial quando nao ha nenhum usuario, viabilizando o
    # primeiro login. TROQUE a senha apos o primeiro acesso.
    enabled: ${APP_BOOTSTRAP_ADMIN:true}
    login: ${APP_ADMIN_LOGIN:admin}
    senha: ${APP_ADMIN_SENHA:admin123}
  inventory:
    hold-duration-minutes: ${APP_INVENTORY_HOLD_MINUTES:15}
    expiration-enabled: ${APP_INVENTORY_EXPIRATION_ENABLED:true}
    expiration-sweep-ms: ${APP_INVENTORY_EXPIRATION_SWEEP_MS:30000}

logging:
  pattern:
    # Inclui o traceId (MDC) em cada linha de log, para correlacao com a resposta.
    level: "%5p [%X{traceId:-}]"
